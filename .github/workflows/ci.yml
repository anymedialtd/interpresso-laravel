name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        exclude:
          # Laravel 13 and Testbench 11 require PHP >= 8.3.
          - php: '8.2'
            laravel: '13'
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: interpresso_ci
          MYSQL_USER: interpresso
          MYSQL_PASSWORD: interpresso
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Resolve the selected Laravel version
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          composer config platform.php "$PHP_VERSION.0"
          if [ "$LARAVEL_VERSION" = "13" ]; then
            composer require --dev "orchestra/testbench:^11.0" --no-update --no-interaction
          else
            composer require --dev "orchestra/testbench:^10.0" --no-update --no-interaction
          fi
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs
      - run: composer audit
      - run: ./vendor/bin/phpstan analyse --no-progress
      - run: ./vendor/bin/phpunit
      - name: MySQL migrations up, rollback, reapply and developer download
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: interpresso_ci
          DB_USERNAME: interpresso
          DB_PASSWORD: interpresso
        run: ./vendor/bin/phpunit -c phpunit.mysql.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run production
      - run: node --test tests/js/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: ./tests/e2e/seed.sh
      - run: npx playwright test
